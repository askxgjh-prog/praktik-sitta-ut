<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SITTA UT</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-card">
        <h2>SITTA UT</h2>
        <p>Selamat Datang, Silahkan Masukkan Akun Anda</p>
        
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Masukkan email Anda">
            </div>
            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input type="password" id="password" required placeholder="Masukkan password Anda">
                    <i class="fa-solid fa-eye" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>
            <button type="submit" class="btn">Masuk</button>
        </form>

        <div class="login-links">
            <a href="#" onclick="openModal('modalLupaPassword')">Lupa Password?</a>
            <a href="#" onclick="openModal('modalDaftar')">Belum punya akun?</a>
        </div>
    </div>

    <div id="modalLupaPassword" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalLupaPassword')">&times;</span>
            <h3 style="color:#002b5b; margin-bottom:10px;">Lupa Password</h3>
            <p style="font-size:0.85rem; margin-bottom:15px; color:#555;">Masukkan email Anda untuk menerima bantuan reset password.</p>
            <div class="form-group">
                <input type="email" placeholder="Email Anda">
            </div>
            <button class="btn" onclick="alert('Instruksi dikirim ke email!'); closeModal('modalLupaPassword');">Kirim</button>
        </div>
    </div>

    <div id="modalDaftar" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalDaftar')">&times;</span>
            <h3 style="color:#002b5b; margin-bottom:15px;">Pendaftaran Akun SITTA</h3>
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Nama Lengkap">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Email">
            </div>
            <button class="btn" onclick="alert('Pendaftaran Berhasil! Silakan Login.'); closeModal('modalDaftar');">Daftar</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
